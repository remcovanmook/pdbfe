name: Mirror health

# The sync worker runs a weekly health check & repair (workers/sync/health.js,
# cron "7 3 * * SUN") and records a report in D1 (_health_runs). This workflow
# runs half an hour later and makes noise about it: job summary, a warning
# annotation and a `mirror-health` issue (opened or commented) whenever
# anything was repaired, errored, alerted — or the weekly run is missing.
# A clean run comments on and closes any open mirror-health issue. The run
# itself fails only when the report can't be read.

on:
  schedule:
    - cron: "40 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, not at repo level.
    # Without it they are empty and the D1 query URL 404s.
    environment: deploy env
    steps:
      - uses: actions/checkout@v4

      - name: Read latest health report
        id: report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          REPORT_FILE: ${{ runner.temp }}/mirror-health.md
        run: python3 .github/scripts/mirror_health_report.py

      - name: Open or update the mirror-health issue
        if: steps.report.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.report.outputs.title }}
          REPORT_FILE: ${{ runner.temp }}/mirror-health.md
        run: |
          gh label create mirror-health --color B60205 --description "Weekly mirror health check found drift or failed" --force
          ISSUE=$(gh issue list --label mirror-health --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$REPORT_FILE"
          else
            gh issue create --title "$TITLE" --label mirror-health --body-file "$REPORT_FILE"
          fi

      - name: Close the mirror-health issue on a clean run
        if: steps.report.outputs.attention == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_FILE: ${{ runner.temp }}/mirror-health.md
        run: |
          ISSUE=$(gh issue list --label mirror-health --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$REPORT_FILE"
            gh issue close "$ISSUE" --reason completed
          fi

      # The issue is the notification; a warning annotation keeps the run
      # green. The run fails only when the report itself can't be read.
      - name: Flag the run when the mirror needed attention
        if: steps.report.outputs.attention == 'true'
        env:
          TITLE: ${{ steps.report.outputs.title }}
        run: echo "::warning::$TITLE"

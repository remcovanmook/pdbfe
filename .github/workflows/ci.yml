# CI pipeline — mirrors the pre-commit hook checks so they run on
# every PR, regardless of whether the contributor has the local git hooks
# configured.
#
# Versioning is NOT enforced per-PR: PRs never edit VERSION. Releases are cut
# deliberately via the Release workflow (workflow_dispatch), which derives the
# next version from the latest git tag — so concurrent PRs never conflict on
# the VERSION line.
#
# Jobs are split by component (workers, frontend, security, integrity)
# and run in parallel. Each job fails independently so you can see
# exactly which layer broke.

name: CI

on:
  # Once per change, on the PR. Not on push to main: main only moves through
  # PRs (ruleset), the PR branch must be up to date with main before merging,
  # so the PR run has already tested exactly the tree that lands — a second
  # run on main re-tests it and holds up releases. The PR's checks are
  # required for merging (ruleset "default"), so main only gets green trees.
  pull_request:
    branches: [main]
  push:
    # auto/** because PRs opened by the upstream-sync workflow use
    # GITHUB_TOKEN, and GitHub deliberately does not fire pull_request events
    # for those — without this, a sync PR shows no CI at all and has to be
    # closed and reopened by hand to get checked. Required checks match by
    # commit, so these runs count for the sync PR.
    branches: ['auto/**']

permissions:
  contents: read

jobs:
  # ── Workers: type checking + unit tests + upstream conformance ────
  workers:
    name: Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Upstream conformance
        run: npm run test:upstream

  # ── Frontend: type checking + unit tests ─────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      # Frontend typecheck depends on tsc from workers/node_modules
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: workers

      # config.js is gitignored (deployment-specific); use the example stub
      - name: Create config stub
        run: cp js/config.js.example js/config.js
        working-directory: frontend

      - name: TypeScript
        run: npm run typecheck
        working-directory: frontend

      - name: Unit tests
        run: npm run test:unit
        working-directory: frontend

  # ── Security: XSS static analysis ────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: XSS lint
        run: node scripts/lint_xss.js

      - name: XSS lint self-test
        run: node --test scripts/test_lint_xss.js

      # The versioning self-test builds the real frontend, which bundles
      # with esbuild from frontend/package.json.
      - name: Install frontend build dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Frontend asset versioning self-test
        run: node --test scripts/test_version_frontend.js

  # ── Frontend build: e2e against what the deploy ships ─────────────
  # Production serves the minified, code-split bundle that
  # scripts/version_frontend.js builds, not the source modules that local
  # dev and the pre-push e2e run. This job runs the e2e suite against it.
  frontend-build-e2e:
    name: Frontend build e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No lifecycle scripts: esbuild and @playwright/test don't need them
      # (the browser comes from `playwright install` below).
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      # Browsers are cached per locked Playwright version. Only the headless
      # shell, which headless tests use, and no --with-deps: the runner
      # image already has Chrome's system libraries, and the apt step took
      # most of this job (5+ minutes on a slow mirror).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # The locked Playwright, not npx (which could fetch another version).
      - name: Install Chromium headless shell
        run: ./node_modules/.bin/playwright install --only-shell chromium
        working-directory: frontend

      # The e2e suite calls the live API, so config.js needs the real domain
      # (the example's placeholders make every API call fail).
      - name: Create config
        run: sed 's|<your-domain>|pdbfe.dev|g' js/config.js.example > js/config.js
        working-directory: frontend

      - name: Build the deploy output
        run: node scripts/version_frontend.js "$RUNNER_TEMP/frontend-dist" ci

      - name: E2E against the build
        run: ./node_modules/.bin/playwright test --reporter=line
        working-directory: frontend
        env:
          CI: "true"
          E2E_SERVE_DIR: ${{ runner.temp }}/frontend-dist

  # ── Integrity: cross-component consistency checks ────────────────
  integrity:
    name: Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      # Schema sync checker imports from workers/api/entities.js
      # which needs @cloudflare/workers-types for tsc, but runs
      # fine in plain Node.js without it. Install for safety.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: workers

      - name: Locale completeness
        run: node scripts/check_locales.js

      - name: Bundle size budget
        run: |
          JS_SIZE=$(find frontend/js -name '*.js' -not -path '*/tests/*' | xargs cat | wc -c)
          CSS_SIZE=$(find frontend/css -name '*.css' -not -path '*/third_party/*' | xargs cat | wc -c)
          TOTAL=$((JS_SIZE + CSS_SIZE))
          echo "Frontend JS: ${JS_SIZE} bytes"
          echo "Frontend CSS: ${CSS_SIZE} bytes"
          echo "Total: ${TOTAL} bytes"
          # Fail if total exceeds 512 KB
          if [ "$TOTAL" -gt 524288 ]; then
            echo "::error::Frontend bundle size ${TOTAL} exceeds 512 KB budget"
            exit 1
          fi

  # ── Schema: generated artifact freshness ──────────────────────────
  schema:
    name: Schema Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration-coverage check can diff
          # extracted/schema.sql against origin/main (and HEAD~1).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install --only-binary :all: 'pyyaml==6.0.2'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts
        working-directory: workers

      - name: Regenerate schema artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}  # GitHub API rate limit (tags lookup)
        run: |
          python scripts/parse_django_models.py --force
          python scripts/gen_graphql_schema.py
          python scripts/gen_openapi_spec.py

      - name: Run Python script tests
        run: bash scripts/test.sh

      - name: Check for drift
        run: |
          if ! git diff --exit-code extracted/ frontend/js/entities.js; then
            echo "::error::Generated files are stale. Run: .venv/bin/python scripts/parse_django_models.py --force"
            exit 1
          fi

      # A regenerated schema.sql that adds columns/tables must ship with a
      # matching migration, or existing databases 500 ("no such column") on
      # deploy — the D1 outage on the 2.80.1 refresh. Fails if any addition
      # (vs origin/main) is not covered by a database/migrations/ file.
      - name: Check schema changes ship with a migration
        run: |
          git fetch --no-tags origin main
          python scripts/diff_schema.py --check --base origin/main

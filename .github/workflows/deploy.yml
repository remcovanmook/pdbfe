# Release workflow — MANUAL trigger only (workflow_dispatch).
#
# Merges to main do NOT deploy. Cutting a release is a deliberate act: this
# workflow derives the next version from the latest git tag (tags are the
# source of truth — VERSION is never edited in PRs, so concurrent PRs never
# conflict on it), then generates configs, applies migrations, deploys all
# workers + frontend, and tags v<next>.
#
# deploy.sh remains the single source of truth for the deploy sequence.
#
# Required secrets: see the env blocks below (Cloudflare token/account, D1 ids,
# KV id, API domain, Vectorize index name).

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (auto = derive from commits since last tag)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

jobs:
  release:
    name: Release + Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: deploy env
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for version derivation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: |
          pip install pyyaml
          npm ci --prefix workers --ignore-scripts

      # Next version = latest v* tag + bump. `auto` picks the level from
      # conventional-commit prefixes in the commits since that tag
      # (feat -> minor, `!` / BREAKING CHANGE -> major, else patch).
      - name: Determine version
        id: ver
        run: |
          git fetch --tags --quiet || true
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          BASE="${LATEST#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"

          LEVEL="${{ inputs.bump }}"
          if [ "$LEVEL" = "auto" ]; then
            RANGE="${LATEST}..HEAD"
            git rev-parse "$LATEST" >/dev/null 2>&1 || RANGE="HEAD"
            LOG="$(git log $RANGE --format='%s%n%b' 2>/dev/null || true)"
            if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
              LEVEL=major
            elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
              LEVEL=minor
            else
              LEVEL=patch
            fi
          fi

          case "$LEVEL" in
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN + 1)); PAT=0 ;;
            *)     PAT=$((PAT + 1)) ;;
          esac
          NEXT="${MAJ}.${MIN}.${PAT}"
          echo "latest=${LATEST} level=${LEVEL} next=v${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${NEXT}" > VERSION

      # Generate wrangler toml configs + frontend config.js from .example
      # templates (real configs are gitignored). Reads the VERSION written above.
      - name: Generate configs
        run: ./scripts/deploy.sh --generate-configs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_USERDB_ID: ${{ secrets.D1_USERDB_ID }}
          KV_SESSIONS_ID: ${{ secrets.KV_SESSIONS_ID }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          VECTORIZE_INDEX_NAME: ${{ secrets.VECTORIZE_INDEX_NAME }}

      - name: Deploy
        run: ./scripts/deploy.sh --remote --apply-migrations --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tag the release (source of truth). Also best-effort record VERSION back
      # on main so the file reflects the last release; if branch protection
      # blocks the push, the tag still stands.
      - name: Tag release
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): ${TAG} [skip ci]" || echo "VERSION unchanged"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Tagged ${TAG}."
          git push origin HEAD:main || echo "VERSION commit not pushed (branch protection) — tag is authoritative"

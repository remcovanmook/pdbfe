# Upstream schema sync — checks for new django-peeringdb or PeeringDB
# server releases weekly. If versions changed, regenerates all derived
# artifacts and opens a PR for review.
#
# Can also be triggered manually via workflow_dispatch.

name: Upstream Schema Sync

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write       # failure reports (see "Report failure" below)

jobs:
  sync:
    name: Check & Update
    runs-on: ubuntu-latest
    outputs:
      # Only set when a migration-free update was merged, which is the sole
      # case the release job is allowed to run for.
      merged: ${{ steps.pr.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need HEAD~1 for diff_schema.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: |
          pip install --only-binary :all: 'pyyaml==6.0.2'
          npm ci --prefix workers --ignore-scripts

      - name: Run schema pipeline
        id: pipeline
        run: |
          python scripts/parse_django_models.py 2>&1 | tee /tmp/pipeline.log
          if grep -q "Versions unchanged" /tmp/pipeline.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # parse_django_models.py writes only entities.json, schema.sql,
      # entities.js and entities-worker.js. The GraphQL typedefs and the
      # OpenAPI spec come from separate generators, and CI's Schema Freshness
      # job regenerates all three — so a PR that ships only the first set is
      # stale on arrival and fails its own checks.
      - name: Regenerate derived artifacts
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          python scripts/gen_graphql_schema.py
          python scripts/gen_openapi_spec.py

      # Whether a migration appears decides everything downstream: a schema
      # change that adds tables/columns needs D1 altered before the new code
      # can serve it, so it gets human review. A metadata-only change (a
      # field becoming queryable, say) touches no D1 structure and can ship
      # unattended.
      - name: Generate migration
        id: migration
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          python scripts/diff_schema.py
          if [ -n "$(git status --porcelain database/migrations/)" ]; then
            echo "A migration was generated — this update needs review."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration needed — metadata-only schema change."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read schema version
        if: steps.pipeline.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('extracted/entities.json'))['schema_version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: pr
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          BRANCH="auto/schema-${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # An open PR for this version is already awaiting review — leave its
          # branch untouched so reviewer commits are never clobbered.
          EXISTING=$(gh pr list --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH — nothing to do."
            exit 0
          fi

          # -B and --force make the step idempotent: a leftover branch from a
          # run that pushed but failed before opening a PR is simply rebuilt.
          git checkout -B "$BRANCH"
          git add extracted/ frontend/js/entities.js \
            database/migrations/ scripts/lib/api-schema.yaml
          if git diff --cached --quiet; then
            echo "Pipeline reported a version change but no tracked files differ."
            exit 0
          fi
          git commit -m "chore: update schema to ${{ steps.version.outputs.version }}

          Auto-generated by upstream-sync workflow.
          django-peeringdb and/or PeeringDB server version changed."
          git push --force origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "Schema update: ${{ steps.version.outputs.version }}" \
            --body "Automated schema update detected upstream version change.

          **Review the migration file** in \`database/migrations/\` before merging.
          Apply migrations with: \`./scripts/deploy.sh --remote --apply-migrations\`" \
            --base main \
            --head "$BRANCH")
          PR="${PR_URL##*/}"
          echo "Opened PR #$PR"

          # A generated migration means D1 structure has to change. Applying
          # auto-generated DDL to production unreviewed is the one thing that
          # can take the API down, so stop here and let a human drive.
          if [ "${{ steps.migration.outputs.created }}" = "true" ]; then
            gh pr comment "$PR" --body "This update generates a **database migration**, so it is not auto-merged.

          Review \`database/migrations/\`, then merge and cut a release. Migrations are applied by the release workflow."
            echo "Migration present — leaving PR #$PR for review."
            exit 0
          fi

          # Migration-free: wait for CI, then merge. Checks register
          # asynchronously, so an instant poll reads zero checks as "settled".
          sleep 10
          for _ in $(seq 1 60); do
            CHECKS=$(gh pr checks "$PR" 2>/dev/null || true)
            TOTAL=$(printf '%s' "$CHECKS" | grep -c . || true)
            PENDING=$(printf '%s' "$CHECKS" | grep -cE '^pending' || true)
            [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ] && break
            sleep 15
          done

          # Refuse unless checks exist, none are still running, and none
          # failed. A poll timeout leaves PENDING > 0 and must not merge.
          if [ "${TOTAL:-0}" -eq 0 ] \
             || [ "${PENDING:-1}" -ne 0 ] \
             || printf '%s' "$CHECKS" | grep -qE '^fail'; then
            gh pr comment "$PR" --body "Not auto-merging: CI did not pass or did not settle. Needs a look."
            echo "::error::CI did not pass on PR #$PR (total=${TOTAL:-0} pending=${PENDING:-?}) — not auto-merging."
            exit 1
          fi

          gh pr merge "$PR" --squash --delete-branch
          echo "Merged PR #$PR"
          echo "merged=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.pipeline.outputs.changed == 'false'
        run: echo "Upstream versions unchanged. Nothing to do."

      # A failed scheduled run notifies nobody by default, which is how this
      # workflow stayed broken from 2026-07-06 to 2026-09-14 without anyone
      # noticing. File an issue instead — reusing the open one, so a repeat
      # weekly failure becomes a comment thread rather than an issue per week.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Upstream Schema Sync is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Match on exact title rather than a label (no label to provision)
          # and rather than --search (the search index lags a fresh issue,
          # which would let a retry open a duplicate).
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body \
              "The weekly upstream schema sync failed.

          Run: $RUN_URL

          This issue is reused by later failures; close it once the sync is green."
          fi

  # Ships the merged schema update to production. Guarded twice over: it runs
  # only when the sync actually merged something, and the sync only merges
  # when no migration was generated. Anything touching D1 structure stops at
  # the PR instead and never reaches here.
  release:
    name: Release merged schema update
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      bump: auto
      # The merge landed after this run started, so the triggering SHA is
      # stale — deploying it would ship main without the schema update.
      ref: main
